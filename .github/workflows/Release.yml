name: Release

on:
  push:
    tags:
      - "wm-v*.*.*"

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout the monorepo
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "26.6.0"

      - name: Install dependencies
        run: npm ci

      - name: Publish the installer to GitHub Releases
        working-directory: Application
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
