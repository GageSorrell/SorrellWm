name: Bug Report
description: File a bug report.
title: "[Bug]: "
labels: [ "bug" ]
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
      value: "A bug happened!"
    validations:
      required: true
  - type: dropdown
    id: Package
    attributes:
      label: Package
      description: The package in the monorepo in which the bug exists.
      multiple: true
      options:
        - SorrellWm
        - reactive-event
        - reactive-event-cli
        - (Other)
    validations:
      required: true
  - type: textarea
    id: Steps to Reproduce
    validations:
        required: true
  - type: textarea
    id: Reproducing Repository
    description: A link to a GitHub repo in which the offending package is used to reproduce the bug.
    validations:
        required: false
  - type: upload
    id: screenshots
    attributes:
      label: Upload screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false
